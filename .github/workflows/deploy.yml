# Builds and deploys to GitHub Pages on every push to main.
# Repo settings → Pages → Source: "GitHub Actions" (one-time).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vite.config.ts deliberately sets no `base` — that would 404 the Vercel
      # deploy — so the Pages sub-path is passed here instead of in the config.
      # `npm run typecheck` keeps the type gate that `npm run build` would give
      # us (and runs the local tsc: plain `npx tsc` would fetch an unrelated,
      # deprecated `tsc` package from the registry if it ever went missing).
      - run: npm run typecheck
      - run: npx vite build --base=/pulse-studio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
